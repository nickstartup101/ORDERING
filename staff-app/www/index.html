<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <link rel="icon" href="data:,"/>
  <title>LA DOLCE — Staff</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface":"#FAF9F6","surface-pure":"#FFFFFF","surface-dim":"#F3F1EC","hairline":"#E7E4DD","primary":"#11241C","primary-dark":"#0A1813","forest-emerald":"#0D402B","forest-leaf":"#16593D","taupe":"#857769","charcoal":"#141A17"},fontFamily:{sans:["Noto Sans Lao","DM Sans","sans-serif"],lao:["Noto Sans Lao","sans-serif"]}}}};</script>
  <link rel="stylesheet" href="css/style.css"/>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-surface text-charcoal min-h-screen font-lao">
  <div id="staffLoginScreen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-surface-pure border border-hairline rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="text-center"><h1 class="font-serif-title text-[24px] text-primary">LA DOLCE Staff</h1><p class="text-[12px] text-taupe">Staff / Superadmin Login</p></div>
      <div class="space-y-3">
        <input id="staffLoginEmail" type="email" placeholder="Email" class="w-full rounded-lg border border-hairline p-3"/>
        <input id="staffLoginPassword" type="password" placeholder="Password" class="w-full rounded-lg border border-hairline p-3"/>
        <button type="button" onclick="handleStaffLogin()" class="w-full py-3 rounded-lg bg-forest-emerald text-white font-bold">ເຂົ້າສູ່ລະບົບ Staff</button>
      </div>
    </div>
  </div>
  <main id="staffAppShell" class="hidden max-w-6xl mx-auto p-4 md:p-8">
<div id="adminStaffAppView" class="admin-panel hidden space-y-6">
      <div class="p-4 rounded-xl bg-forest-emerald text-white flex flex-wrap items-center justify-between gap-3 shadow-sm">
        <div class="flex items-center gap-3">
          <span class="w-10 h-10 rounded-lg bg-white/10 flex items-center justify-center shrink-0">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>
          </span>
          <div>
            <h2 class="font-serif-title text-[18px]">Barista Kitchen Display</h2>
            <p class="text-[11px] opacity-80">ຄິວອໍເດີ້ສົດຈາກລູກຄ້າ • ມີ Pop-up ກວດສອບ & ສຽງເຕືອນອັດຕະໂນມັດ</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" id="btnStaffEnableNotify" onclick="enableStaffNotifications()" class="text-[11px] px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 text-white font-semibold flex items-center gap-1.5 cursor-pointer">
            <svg class="w-3.5 h-3.5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span>ເປີດສຽງ & ແຈ້ງເຕືອນ</span>
          </button>
          <button type="button" onclick="logoutStaff()" class="text-[11px] px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 text-white uppercase tracking-wider cursor-pointer">Sign Out</button>
        </div>
      </div>

      <div class="flex gap-2 border-b border-hairline pb-2 overflow-x-auto">
        <button type="button" onclick="switchStaffSubTab('active')" id="staff-tab-active" class="px-4 py-1.5 rounded-lg bg-forest-emerald text-white text-[12px] font-bold shadow-xs shrink-0 cursor-pointer">
          ຄິວທີ່ກຳລັງດຳເນີນການ
        </button>
        <button type="button" onclick="switchStaffSubTab('history')" id="staff-tab-history" class="px-4 py-1.5 rounded-lg bg-surface border border-hairline text-taupe text-[12px] shrink-0 cursor-pointer">
          ສຳເລັດແລ້ວ
        </button>
        <button type="button" onclick="switchStaffSubTab('cancelled')" id="staff-tab-cancelled" class="px-4 py-1.5 rounded-lg bg-surface border border-hairline text-red-700 text-[12px] shrink-0 cursor-pointer">
          ປະຕິເສດ / ຍົກເລີກ
        </button>
      </div>

      <div id="staffOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="staffOrdersContainerHistory" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      <div id="staffOrdersContainerCancelled" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>  </main>
<div id="staffNewOrderModal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center hidden p-4">
    <div class="bg-surface-pure w-full max-w-md rounded-2xl border-2 border-forest-emerald p-5 shadow-2xl space-y-4 animate-scale-up"></div>
  </div>
<div id="staffRejectModal" class="fixed inset-0 z-[60] bg-black/50 backdrop-blur-xs flex items-center justify-center hidden p-4">
    <div class="bg-surface-pure w-full max-w-sm rounded-2xl border border-hairline p-6 shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <div class="w-11 h-11 rounded-full bg-red-50 border border-red-200 text-red-700 mx-auto flex items-center justify-center">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        </div>
        <h3 class="font-serif-title text-[19px] text-primary font-medium">ປະຕິເສດອໍເດີ້ & ແຈ້ງຣີຟັນ</h3>
        <p class="text-[11px] text-taupe">ລະບຸເຫດຜົນເພື່ອແຈ້ງລູກຄ້າໃຫ້ສັ່ງເມນູອື່ນໃໝ່ ແລະ ທຳການຣີຟັນເງິນຄືນ</p>
      </div>
      <div class="space-y-3 text-[13px]">
        <div>
          <label class="block text-[11px] text-taupe uppercase mb-1 font-bold">ເຫດຜົນ:</label>
          <textarea id="rejectInputReason" rows="3" class="w-full rounded-lg border border-hairline p-2.5 text-[12px]" placeholder="ເຊັ່ນ: ເມນູນີ້ວັດຖຸດິບໝົດຊົ່ວຄາວ..."></textarea>
        </div>
        <button type="button" onclick="confirmRejectOrder()" class="w-full py-2.5 rounded-lg bg-red-700 hover:bg-red-800 text-white text-[12px] uppercase font-bold transition-all shadow-xs cursor-pointer">
          ຢືນຢັນປະຕິເສດ & ແຈ້ງຣີຟັນ
        </button>
      </div>
      <button type="button" onclick="closeRejectModal()" class="w-full py-1 text-[11px] text-taupe text-center cursor-pointer">ຍົກເລີກ</button>
    </div>
  </div>
<div id="slipAuditModal" class="fixed inset-0 z-[70] bg-black/60 backdrop-blur-xs flex items-center justify-center hidden p-4">
    <div class="bg-surface-pure w-full max-w-sm rounded-2xl border border-hairline overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 border-b border-hairline flex items-center justify-between">
        <h4 class="font-serif-title text-[16px] text-primary">Transfer Slip</h4>
        <button type="button" onclick="closeSlipAuditModal()" class="w-7 h-7 rounded-full border border-hairline flex items-center justify-center text-taupe cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="p-4 text-center bg-surface">
        <img id="slipAuditImage" src="" class="max-h-80 mx-auto rounded-xl border border-hairline object-contain"/>
        <p class="text-[11px] text-taupe font-mono mt-2" id="slipAuditOrderRef">Ref #LD-000</p>
      </div>
      <div class="p-4 border-t border-hairline bg-surface-pure flex justify-end">
        <button type="button" onclick="closeSlipAuditModal()" class="px-4 py-2 rounded-lg bg-forest-emerald text-white text-[12px] font-medium cursor-pointer">ກວດສອບແລ້ວ</button>
      </div>
    </div>
  </div>
<div id="atelierToast" class="fixed top-6 left-1/2 -translate-x-1/2 z-[999] opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-4 px-5 py-3 rounded-full bg-forest-gradient text-white text-[12px] font-bold shadow-2xl flex items-center gap-2 border border-white/20">
    <svg class="w-4 h-4 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    <span id="toastMsg">Action completed</span>
  </div>
  <script src="js/config.js?v=5"></script>
  <script src="js/dialog.js?v=5"></script>
  <script src="js/audio.js?v=5"></script>
  <script src="js/staff.js?v=5"></script>
  <script src="js/push.js?v=5"></script>
  <script src="js/app-staff.js?v=5"></script>
</body>
</html>
