name: Build Staff APK

on:
  push:
    branches:
      - main
    paths:
      - "staff-app/**"
      - "web/css/style.css"
      - "web/js/config.js"
      - "web/js/dialog.js"
      - "web/js/audio.js"
      - "web/js/staff.js"
      - ".github/workflows/build-staff-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies and sync Capacitor
        working-directory: staff-app
        run: npm install && npm run cap:sync

      - name: Build debug APK
        working-directory: staff-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LA-DOLCE-Staff-APK
          path: staff-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
