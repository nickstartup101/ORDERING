<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>LA DOLCE — Atelier & Coffee Management</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Noto+Sans+Lao:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..24,300..400,0..1,0" rel="stylesheet"/>

  <!-- Tailwind CSS Engine -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#FAF9F6",
            "surface-pure": "#FFFFFF",
            "surface-dim": "#F3F1EC",
            "hairline": "#E7E4DD",
            "primary": "#11241C",
            "primary-dark": "#0A1813",
            "forest-emerald": "#0D402B",
            "forest-leaf": "#16593D",
            "taupe": "#857769",
            "charcoal": "#141A17"
          },
          fontFamily: {
            sans: ["Noto Sans Lao", "DM Sans", "sans-serif"],
            lao: ["Noto Sans Lao", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css"/>

  <!-- Firebase Web SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- 🔥 ຝັງຟັງຊັນໄວ້ເທິງສຸດໃນ <head> ເພື່ອແກ້ openAuthModal is not defined 100% -->
  <script>
    function openAuthModal() {
      const modal = document.getElementById('authModal');
      if (modal) {
        modal.classList.remove('hidden');
      } else {
        alert("ກະລຸນາໂຫຼດໜ້າເວັບໃໝ່");
      }
    }
    function closeAuthModal() {
      const modal = document.getElementById('authModal');
      if (modal) modal.classList.add('hidden');
    }
  </script>
</head>
