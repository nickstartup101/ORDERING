<!-- Global Handlers in Head ເພື່ອປ້ອງກັນ ReferenceError 100% -->
  <script>
    function openAuthModal() {
      const modal = document.getElementById('authModal');
      if (modal) modal.classList.remove('hidden');
    }
    function closeAuthModal() {
      const modal = document.getElementById('authModal');
      if (modal) modal.classList.add('hidden');
    }

    // 🔥 ຝັງຟັງຊັນ confirmAddToCart ໄວ້ກ່ອນ ເພື່ອບໍ່ໃຫ້ຕິດ ReferenceError
    function confirmAddToCart() {
      if (typeof window.confirmAddToCart === 'function' && window.confirmAddToCart !== confirmAddToCart) {
        window.confirmAddToCart();
        return;
      }
      
      if (!activeCustomizingItem) {
        alert("ກະລຸນາເລືອກເມນູກ່ອນ!");
        return;
      }

      const milkRadio = document.querySelector('input[name="milkOption"]:checked');
      const milkVal = milkRadio ? milkRadio.value : 'Standard';
      const extraShot = document.getElementById('addonExtraShot')?.checked || false;

      let unitPrice = activeCustomizingItem.variants?.[selectedVariant] || 4.50;
      if (milkVal.includes('Oat') || milkVal.includes('Almond')) unitPrice += 0.75;
      if (extraShot) unitPrice += 1.20;

      const qty = parseInt(modalQuantity) || 1;

      const cartItem = {
        cartId: 'c_' + Date.now(),
        itemId: activeCustomizingItem.id,
        name: activeCustomizingItem.name,
        variant: selectedVariant || 'std',
        milk: milkVal,
        sweetness: selectedSweetnessLevel || '100%',
        extraShot: extraShot,
        unitPrice: unitPrice,
        quantity: qty,
        total: unitPrice * qty,
        image: activeCustomizingItem.image
      };

      cart.push(cartItem);
      localStorage.setItem('ladolce_cart', JSON.stringify(cart));
      
      if (typeof updateCartBadges === 'function') updateCartBadges();
      if (typeof closeCustomizeModal === 'function') closeCustomizeModal();

      alert(`ເພີ່ມ "${cartItem.name}" ເຂົ້າກະຕ່າແລ້ວ!`);
    }
  </script>
